---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: docker-debian12-ansible-python313
    image: janleshy/debian12-ansible-python313:latest
    pre_build_image: true
    privileged: true
    command: /lib/systemd/systemd
    published_ports:
      - 8123:8123
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  env:
    ANSIBLE_ROLES_PATH: "/home/jan/projects/private/ansible_projects/collections/ansible_collections/janleshy/ansible-collection-homeassistant/ansible-collection-homeassistant/roles"

verifier:
  name: ansible
